<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Intake Form</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f9; margin: 0; padding: 20px 0; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; display: flex; flex-direction: column; }
        h3 { margin-top: 0; color: #333; text-align: center; margin-bottom: 20px; }
        label { font-size: 13px; color: #333; margin-bottom: 5px; font-weight: bold; display: block; }
        input { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: calc(100% - 22px); }
        .file-box { margin-bottom: 15px; padding: 5px 0; }
        button { background: #24292e; color: white; border: none; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 4px; margin-top: 10px; }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="form-container">
        <h3>Application Intake Form</h3>
        
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="fatherName" placeholder="Father's Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>
        
        <input type="text" id="pob" placeholder="Place of Birth" required>
        <input type="text" id="nationality" placeholder="Nationality" required>
        <input type="email" id="useremail" placeholder="Your Email Address" required>
        <input type="tel" id="mobile" placeholder="Mobile Number" required>
        <input type="text" id="address" placeholder="Current Residential Address" required>
        <input type="text" id="major" placeholder="Applying Major" required>
        
        <label for="userfiles">Choose Files to Attach:</label>
        <input type="file" id="userfiles" class="file-box" accept=".pdf, .jpg, .jpeg, .png" multiple required>
        
        <button type="button" id="submitBtn" onclick="startApplicationTransmission()">Submit Application</button>
    </div>

    <script>
        // === PASTE YOUR CREDENTIALS BELOW ===
        const SUPABASE_URL = "https://brldoaeffbajoitxohej.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_0DWJebA2Vn3HIyGf7iSxgg_uZAfbfTR";
        // ===================================

        async function startApplicationTransmission() {
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('useremail').value;
            const firstName = document.getElementById('firstName').value;

            if(!email || !firstName) {
                alert("Please fill out your required fields before submitting.");
                return;
            }

            btn.innerText = "Processing...";
            btn.disabled = true;

            const fatherName = document.getElementById('fatherName').value;
            const lastName = document.getElementById('lastName').value;
            const dob = document.getElementById('dob').value;
            const pob = document.getElementById('pob').value;
            const nationality = document.getElementById('nationality').value;
            const mobile = document.getElementById('mobile').value;
            const address = document.getElementById('address').value;
            const major = document.getElementById('major').value;
            
            const fileInput = document.getElementById('userfiles');
            const filesList = fileInput.files;

            const folderName = email.toLowerCase().replace(/[^a-z0-9]/g, "_");
            
            alert("Upload Status: Initializing connection channels...");

            try {
                const publicUrls = [];

                // 1. Upload files securely via native PUT streams into your storage subfolders
                for (let i = 0; i < filesList.length; i++) {
                    const file = filesList[i];
                    const safeFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
                    const uniqueFileName = Date.now() + "_" + safeFileName;
                    
                    const storageEndpoint = SUPABASE_URL + "/storage/v1/object/user_files/" + folderName + "/" + uniqueFileName;

                    const storageResponse = await fetch(storageEndpoint, {
                        method: "PUT",
                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                            "Content-Type": file.type
                        },
                        body: file
                    });

                    if (!storageResponse.ok) {
                        const errText = await storageResponse.text();
                        throw new Error("File Transfer Blocked: " + errText);
                    }

                    publicUrls.push(SUPABASE_URL + "/storage/v1/object/public/user_files/" + folderName + "/" + uniqueFileName);
                }

                alert("Files saved into folders! Syncing fields directly to database row...");

                // 2. Insert records matching your SQL column structure perfectly with fixed schema targets
                const tableEndpoint = SUPABASE_URL + "/rest/v1/student_applications";
                const databasePayload = [{
                    first_name: firstName,
                    father_name: fatherName,
                    last_name: lastName,
                    dob: dob,
                    pob: pob,
                    nationality: nationality,
                    email: email,
                    mobile: mobile,
                    address: address,
                    major: major,
                    file_url: publicUrls.join(" | ")
                }];

                const tableResponse = await fetch(tableEndpoint, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal",
                        // CRUCIAL ROUTING FIX: Forces both parsing routers to treat requests directly inside the public schema layers
                        "Content-Profile": "public",
                        "Accept-Profile": "public"
                    },
                    body: JSON.stringify(databasePayload)
                });

                if (tableResponse.ok) {
                    alert("🎉 SUCCESS! Your full student profile details and files have been completely saved!");
                    
                    // Clear inputs manually
                    document.getElementById('firstName').value = "";
                    document.getElementById('fatherName').value = "";
                    document.getElementById('lastName').value = "";
                    document.getElementById('dob').value = "";
                    document.getElementById('pob').value = "";
                    document.getElementById('nationality').value = "";
                    document.getElementById('useremail').value = "";
                    document.getElementById('mobile').value = "";
                    document.getElementById('address').value = "";
                    document.getElementById('major').value = "";
                    document.getElementById('userfiles').value = "";
                } else {
                    const responseText = await tableResponse.text();
                    alert("Database parameter registration issue: " + responseText);
                }

            } catch (err) {
                alert("Submission Status Error: " + err.message);
            } finally {
                btn.innerText = "Submit Application";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
